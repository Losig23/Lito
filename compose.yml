services:
  api:
    build:
      context: ./apps/api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://lito:lito@db:5432/lito
    depends_on:
      - db
    volumes:
      - ./apps/api:/app

  db:
    image: postgres:16
    environment:
      - POSTGRES_USER=lito
      - POSTGRES_PASSWORD=lito
      - POSTGRES_DB=lito
    ports:
      - "5432:5432"
    volumes:
      - lito_db:/var/lib/postgresql/data

volumes:
  lito_db:
